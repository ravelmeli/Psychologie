<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #character {
          position: absolute;
          inset: 0;
          font-family: Montserrat, sans-serif;
          color: #16140f;
        }
        #character .floor-shadow {
          position: absolute; left: 20px; top: 1416px; width: 340px; height: 48px;
          border-radius: 50%; background: radial-gradient(ellipse at center, rgba(40, 28, 14, 0.28), transparent 70%);
        }
        #character .rig, #character .inner { position: absolute; inset: 0; transform-origin: 190px 1440px; }
        #character .pose { position: absolute; opacity: 0; }
      </style>
      <div id="character" data-composition-id="character" data-width="1080" data-height="1920">
        <div class="floor-shadow"></div>
        <div class="rig" id="character-rig">
          <div class="inner" id="character-inner">
            <img id="character-02_explique" class="pose" src="assets/poses/02_explique.png" alt="" style="left:-27.2px;top:628.5px;width:468.5px;height:839.0px" />
            <img id="character-03_designe_droite" class="pose" src="assets/poses/03_designe_droite.png" alt="" style="left:-25.5px;top:627.0px;width:468.5px;height:839.0px" />
            <img id="character-04_reflechit" class="pose" src="assets/poses/04_reflechit.png" alt="" style="left:-67.8px;top:632.0px;width:468.5px;height:839.0px" />
            <img id="character-05_tente_achat" class="pose" src="assets/poses/05_tente_achat.png" alt="" style="left:-64.5px;top:624.5px;width:468.5px;height:839.0px" />
            <img id="character-06_inquiet" class="pose" src="assets/poses/06_inquiet.png" alt="" style="left:-58.2px;top:628.0px;width:469.0px;height:838.5px" />
            <img id="character-07_surpris" class="pose" src="assets/poses/07_surpris.png" alt="" style="left:-61.0px;top:637.5px;width:468.5px;height:839.0px" />
            <img id="character-08_rassure" class="pose" src="assets/poses/08_rassure.png" alt="" style="left:-58.0px;top:626.0px;width:468.5px;height:839.0px" />
            <img id="character-10_rit_content" class="pose" src="assets/poses/10_rit_content.png" alt="" style="left:-53.2px;top:629.5px;width:469.0px;height:838.5px" />
            <img id="character-11_triste_decu" class="pose" src="assets/poses/11_triste_decu.png" alt="" style="left:-57.0px;top:630.0px;width:468.5px;height:839.0px" />
            <img id="character-13_compte_doigts" class="pose" src="assets/poses/13_compte_doigts.png" alt="" style="left:-61.2px;top:633.5px;width:468.5px;height:839.0px" />
          </div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const POSES = [[0.0, "02_explique"], [2.6, "03_designe_droite"], [4.5, "04_reflechit"], [10.2, "02_explique"], [11.8, "07_surpris"], [14.0, "03_designe_droite"], [15.9, "02_explique"], [16.4, "07_surpris"], [18.7, "02_explique"], [20.4, "07_surpris"], [22.7, "03_designe_droite"], [24.8, "04_reflechit"], [26.0, "03_designe_droite"], [30.7, "04_reflechit"], [34.2, "02_explique"], [36.8, "03_designe_droite"], [41.2, "06_inquiet"], [43.8, "03_designe_droite"], [46.3, "02_explique"], [48.3, "04_reflechit"], [51.7, "03_designe_droite"], [55.1, "06_inquiet"], [57.3, "11_triste_decu"], [59.5, "05_tente_achat"], [61.7, "06_inquiet"], [63.9, "02_explique"], [67.4, "04_reflechit"], [70.4, "08_rassure"], [71.4, "13_compte_doigts"], [72.6, "03_designe_droite"], [76.9, "02_explique"], [81.8, "03_designe_droite"], [84.2, "10_rit_content"], [86.4, "08_rassure"], [89.2, "04_reflechit"], [91.2, "02_explique"], [94.1, "03_designe_droite"], [96.0, "10_rit_content"]];
          POSES.forEach(([t, name], i) => {
            const el = "#character-" + name;
            const next = POSES[i + 1];
            if (i === 0) {
              tl.set(el, { opacity: 1 }, 0);
            } else {
              tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, t - 0.06);
              tl.fromTo("#character-rig", { scale: 0.97 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)", immediateRender: false }, t);
            }
            if (next) {
              tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, next[0] - 0.06);
            }
          });
          tl.fromTo("#character-inner", { scaleY: 1 }, { scaleY: 1.008, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 64 }, 0);
          window.__timelines["character"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
