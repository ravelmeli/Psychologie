        }
        #b05 .of { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.14em; color: #3f6b3c; }
        #b05 .big { font-weight: 900; font-size: 140px; line-height: 1; letter-spacing: -0.03em; white-space: nowrap; }
        #b05 .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase; color: #3f6b3c; }
        #b05 .rows { width: 100%; display: flex; flex-direction: column; gap: 34px; }
        #b05 .row { display: flex; align-items: center; gap: 26px; text-align: left; font-weight: 800; font-size: 40px; line-height: 1.15; }

          position: absolute; left: -10px; top: -10px; width: 52px; height: 52px; border-radius: 26px;

        #b05 .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
        #b05 .barv { width: 150px; height: 460px; border-radius: 22px 22px 8px 8px; transform-origin: center bottom; }
        #b05 .cl { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.08em; }
        #b05 .x2 {

        }
        #b05 .receipt { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        #b05 .line {
          display: flex; align-items: center; gap: 18px; font-family: "JetBrains Mono", monospace; font-weight: 700;
          font-size: 30px; padding-bottom: 14px; border-bottom: 3px dashed #e6dfd1; text-align: left;
        }
        #b05 .line .l { flex: 1; }
        #b05 .total { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 18px; }
        #b05 .totalv { font-weight: 900; font-size: 92px; color: #c0352c; white-space: nowrap; }
        #b05 .reaction { position: absolute; right: -10px; bottom: 120px; }
        #b05 .buy {
          align-self: stretch; font-weight: 900; font-size: 54px; letter-spacing: 0.04em; padding: 30px 0;
          border-radius: 26px; background: #f2b84b; box-shadow: 0 12px 0 #c98a12;
        }
        #b05 .cta {
          display: flex; align-items: center; gap: 16px; padding: 18px 28px; border-radius: 44px;
          background: #16140f; color: #ffffff; font-weight: 900; font-size: 30px; white-space: nowrap;
        }
      </style>
      <div id="b05" data-composition-id="b05" data-width="1080" data-height="1920">
        <div class="beat" id="b05-beat">
          <div class="icons"><span class="" id="b05-e1"><img class="ic" src="assets/icons/brain.png" alt="" style="width:230px;height:230px" /></span></div>
          <div class="meter"><div class="meter-top"><span>DOULEUR</span><span>85 %</span></div><div class="bar"><div class="fill" id="b05-e2"></div></div></div>
          <div class="stamp hid" id="b05-e3">PERTE ENREGISTRÉE</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const pop = (s, t) =>
            tl.fromTo(s, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(2.2)" }, t);
          const stamp = (s, t, r) =>
            tl.fromTo(s, { opacity: 0, scale: 1.8, rotation: r }, { opacity: 1, scale: 1, rotation: r, duration: 0.26, ease: "power3.in" }, t);
          const fr = (v, d) => {
            const p = Math.abs(v).toFixed(d).split(".");
            p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            return (v < 0 ? "-" : "") + p.join(",");
          };
          const count = (sel, from, to, t, dur, d, suffix) => {
            const el = document.querySelector(sel);
            const o = { v: from };
            tl.fromTo(o, { v: from }, { v: to, duration: dur, ease: "power2.out", immediateRender: false,
              onUpdate: () => { el.textContent = fr(o.v, d) + suffix; } }, t);
          };
          tl.fromTo("#b05-e2", { scaleX: 0, backgroundColor: "#d9453b" }, { scaleX: 0.85, backgroundColor: "#d9453b", duration: 0.9, ease: "power2.out" }, 0.26);
          stamp("#b05-e3", 1.38, -5);
          tl.fromTo("#b05-beat", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(1.7)" }, 0);
          tl.fromTo("#b05-beat", { opacity: 1, scale: 1 }, { opacity: 0, scale: 0.92, duration: 0.15, ease: "power2.in", immediateRender: false }, 2.37);
          window.__timelines["b05"] = tl;
        })();
      </script>
    </template>
